name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kotlin-tor
        with:
          android: "true"
          extras: "true"
      - name: Gradle check (JVM modules)
        run: ./gradlew :core:check :control:check :proxy:check :cli:compileKotlin --no-daemon
      - name: Android library + extras smoke
        run: >
          ./gradlew
          :android:assembleDebug
          :demo-android:assembleDebug
          :demo-desktop:assemble
          --no-daemon
      - name: Require debug APKs for every Android ABI
        run: |
          set -euo pipefail
          python3 scripts/android-collect-apks.py \
            --src demo-android/build/outputs/apk/debug \
            --dest dist/android-debug \
            --prefix kotlin-tor-demo-debug \
            --require-abis \
            --verify-natives
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: dist/android-debug/*.apk
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kotlin-tor
        with:
          extras: "true"
      - name: Windows desktop smoke (compile + assemble)
        shell: bash
        run: ./gradlew :demo-desktop:assemble --no-daemon
